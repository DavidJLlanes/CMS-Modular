<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
{{{ head_extra }}}
<link rel="stylesheet" href="{{ stylesheet }}">
</head>
<body>
<header class="site-header"><a class="brand" href="/">{{ site_name }}</a>
<nav aria-label="Principal">{{{ nav }}}</nav></header>
<main>
<h1>{{ heading }}</h1>
{{{ content }}}</main>
<footer class="site-footer"><p>{{ site_name }}</p>
<nav aria-label="Pie">{{{ footer_nav }}}</nav></footer>
</body>
</html>
