; Pool PHP-FPM dedicado al panel (perfil A). Copiar a /etc/php/8.3/fpm/pool.d/luxaeterna-panel.conf
[luxaeterna-panel]
user = luxaeterna-panel
group = luxaeterna-panel
listen = /run/php/luxaeterna-panel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s

php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 30
php_admin_value[expose_php] = 0
php_admin_value[display_errors] = 0
php_admin_value[log_errors] = 1
php_admin_value[open_basedir] = /srv/luxaeterna/app:/srv/luxaeterna/var:/srv/luxaeterna/publish:/tmp
