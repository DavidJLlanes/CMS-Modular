; Pool PHP-FPM dedicado al panel (perfil A). Copiar a /etc/php/<versión>/fpm/pool.d/cms-modular-panel.conf (lo hace deploy/install-vps.sh)
[cms-modular-panel]
user = cms-modular
group = cms-modular
listen = /run/php/cms-modular-panel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s

; Memoria para decodificar fotos grandes con GD (ver media.max_pixels) y tiempo para procesar imágenes al publicar.
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[post_max_size] = 16M
php_admin_value[upload_max_filesize] = 14M
php_admin_value[expose_php] = 0
php_admin_value[display_errors] = 0
php_admin_value[log_errors] = 1
php_admin_value[open_basedir] = /var/www/tu-dominio.es/app:/var/www/tu-dominio.es/var:/var/www/tu-dominio.es/publish:/tmp:/var/lib/lux-rules
