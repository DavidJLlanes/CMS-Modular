; Pool PHP-FPM dedicado al panel (perfil A). Copiar a /etc/php/<versión>/fpm/pool.d/luxaeterna-panel.conf (lo hace deploy/install-vps.sh)
[luxaeterna-panel]
user = luxaeterna
group = luxaeterna
listen = /run/php/luxaeterna-panel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s

php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 30
php_admin_value[expose_php] = 0
php_admin_value[display_errors] = 0
php_admin_value[log_errors] = 1
php_admin_value[open_basedir] = /var/www/luxaeterna.es/app:/var/www/luxaeterna.es/var:/var/www/luxaeterna.es/publish:/tmp:/var/lib/lux-rules
