# LuxAeterna · perfil A (VPS con Nginx + PHP-FPM). Ejemplo para https://luxaeterna.es
# Adaptar rutas: APP = código (solo lectura), PUBLISH = directorio operativo de publicación.
#   APP     = /var/www/luxaeterna.es/app
#   PUBLISH = /var/www/luxaeterna.es/publish   (contiene releases/ y current)

server {
    listen 80;
    listen [::]:80;
    server_name luxaeterna.es www.luxaeterna.es;
    # Renovación de certbot (webroot): el desafío HTTP-01 se sirve sin redirigir.
    location /.well-known/acme-challenge/ { root /var/www/luxaeterna.es/acme; }
    location / { return 301 https://luxaeterna.es$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name luxaeterna.es;

    ssl_certificate     /etc/letsencrypt/live/luxaeterna.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxaeterna.es/privkey.pem;

    # Sitio público: solo archivos estáticos de la versión activa.
    root /var/www/luxaeterna.es/publish/current;
    index index.html;
    error_page 404 /404.html;
    server_tokens off;
    access_log /var/log/nginx/luxaeterna.es.access.log;
    error_log  /var/log/nginx/luxaeterna.es.error.log;

    # Cabeceras de seguridad del sitio público: ver snippets/lux-security-headers.conf (se incluye en cada location).

    # Nunca servir archivos ocultos (incluye .lux-release.json) ni datos privados.
    location ~ /\. { return 404; }
    # Los archivos PHP nunca se sirven desde la raíz pública (ni como texto). Solo /admin/ tiene PHP.
    location ~* \.(php|phtml|phar)$ { return 404; }
    location ~* ^/(var|publish|releases|src|config|bin|deploy|tests|docs)(/|$) { return 404; }

    # Recursos con huella de contenido: caché larga e inmutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /var/www/luxaeterna.es/app/deploy/nginx/snippets/lux-security-headers.conf;
        try_files $uri =404;
    }

    # El HTML se revalida siempre.
    location / {
        add_header Cache-Control "no-cache";
        include /var/www/luxaeterna.es/app/deploy/nginx/snippets/lux-security-headers.conf;
        try_files $uri $uri/index.html =404;
    }

    # Panel: único punto con PHP. Se sirve desde el código, no desde la versión publicada.
    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        root /var/www/luxaeterna.es/app/public;
        client_max_body_size 1m;
        try_files $uri /admin/index.php;

        location ~ ^/admin/index\.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
            fastcgi_param HTTP_PROXY "";   # mitiga "httpoxy"
            fastcgi_pass unix:/run/php/luxaeterna-panel.sock;
            fastcgi_read_timeout 30s;
        }
        # Ningún otro PHP es ejecutable.
        location ~ \.php$ { return 404; }
    }
}

# www → dominio sin www (usa el mismo certificado; debe cubrir www.luxaeterna.es).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.luxaeterna.es;
    ssl_certificate     /etc/letsencrypt/live/luxaeterna.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxaeterna.es/privkey.pem;
    return 301 https://luxaeterna.es$request_uri;
}
