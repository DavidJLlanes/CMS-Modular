# Cabeceras de seguridad del sitio público. Se incluye en cada location con contenido propio, porque
# en Nginx un add_header dentro de un location anula los heredados del server. El panel (/admin/) no usa
# este archivo: su CSP y el resto de cabeceras las emite la aplicación.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
